version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
    ignore:
      # The formatter version is part of the style; change it on purpose, with .clang-format.
      - dependency-name: https://github.com/pre-commit/mirrors-clang-format
    groups:
      hooks:
        patterns: ["*"]
