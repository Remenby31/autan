version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
    ignore:
      # The formatter version is part of the style; change it on purpose, with .clang-format.
      - dependency-name: https://github.com/pre-commit/mirrors-clang-format
      # The typos repository also tags its internal crates (varcon-core-v5.x); typos itself is 1.x.
      - dependency-name: https://github.com/crate-ci/typos
        versions: [">= 2"]
    groups:
      hooks:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: build
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: build
    groups:
      website:
        patterns: ["*"]
