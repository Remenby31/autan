self-hosted-runner:
  # DGX Spark runners (issue #4); only spark-5359 carries "bench", for timed benchmarks.
  labels: [gpu, gb10, bench, tests]
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # GitHub added the top-level cache-mode key in September 2026; actionlint 1.7.12 predates it.
      - 'unexpected key "cache-mode" for "workflow" section'
