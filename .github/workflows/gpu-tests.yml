# Builds the solver with CUDA, MPI, METIS and Scotch and runs the whole test suite (CPU and GPU)
# on a DGX Spark runner labelled `tests` (spark; spark-5359 is kept for benchmarks), under the
# GPU lock. Self-hosted runners never run fork pull requests: the job condition skips them and
# the runner's job-started hook refuses them (docs/infra/runners.md).
name: gpu-tests

on:
  push:
    branches: [main]
    paths: &paths
      [codegen/**, kernels/**, physics/**, core/**, runtime/**, partition/**, io/**, tests/**, CMakeLists.txt, .github/workflows/gpu-tests.yml]
  pull_request:
    paths: *paths
    # ready_for_review: a draft that becomes ready runs at once; drafts themselves are skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

# Pull requests cancel their older run; runs on main queue, each checking a merged commit.
concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft)
    runs-on: [self-hosted, linux, ARM64, gpu, gb10, tests]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent: the pull request's own change.
          fetch-depth: 2
      - name: What the pull request changes
        id: scope
        if: github.event_name == 'pull_request'
        run: echo "paths=$(git diff --name-only HEAD^1 HEAD -- | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Configure with CUDA, MPI, METIS and Scotch
        run: >-
          cmake -S . -B build -G Ninja -DAUTAN_ENABLE_CUDA=ON -DAUTAN_ENABLE_MPI=ON
          -DAUTAN_ENABLE_METIS=ON -DAUTAN_ENABLE_SCOTCH=ON -DCMAKE_CUDA_ARCHITECTURES=121
          -DAUTAN_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      # CPU tests outside the GPU lock, with no GPU visible: a test that needs one but lacks the
      # `gpu` label fails here instead of running without the lock. MPI tests one at a time: they
      # busy-poll, and concurrent ranks on shared cores starve each other.
      - name: CPU tests (no GPU, outside the lock)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          ctest --test-dir build -LE 'gpu|mpi' -j 4 --output-on-failure --no-tests=error
          ctest --test-dir build -L mpi -LE gpu -j 1 --output-on-failure --no-tests=error
      - name: Give this job priority on the GPU lock
        run: bench/ci/priority.sh start 90
      - name: GPU tests (under the GPU lock, at most 10 minutes)
        run: >-
          bench/lock/autan-gpu-lock -m "gpu-tests: ctest -L gpu" -t 600 --
          ctest --test-dir build -L gpu -j 1 --output-on-failure --no-tests=error
      - name: Install the generator's test environment
        working-directory: codegen
        run: uv sync --locked
      # Every generated loop, strategy and policy on the GPU against the host loops (595 tests,
      # 39 s on the Spark); the slow ones in their own shards below.
      - name: Generator on the GPU (under the GPU lock)
        working-directory: codegen
        env:
          AUTAN_SPIKE_LIB: ${{ github.workspace }}/build/codegen/libautan_spike_gpu.so
        run: >-
          ../bench/lock/autan-gpu-lock -m "gpu-tests: codegen pytest --backend gpu, not slow" -t 600 --
          uv run --locked pytest --backend gpu -m "not slow" -q
      # The 25 slow ones (second-order MMS on the device, ~55 s each, 22 min in all on the Spark)
      # in 4 shards of about 6 minutes, each its own hold of the lock: on main, and on pull
      # requests that change the generator or the kernels.
      - name: Generator's slow tests on the GPU (4 shards under the GPU lock)
        if: >-
          github.event_name != 'pull_request' ||
          contains(steps.scope.outputs.paths, 'codegen/') || contains(steps.scope.outputs.paths, 'kernels/')
        working-directory: codegen
        env:
          AUTAN_SPIKE_LIB: ${{ github.workspace }}/build/codegen/libautan_spike_gpu.so
        run: |
          uv run --locked pytest --backend gpu -m slow --collect-only -q | grep '::' > "$RUNNER_TEMP/slow"
          echo "$(wc -l < "$RUNNER_TEMP/slow") slow tests"
          for k in 0 1 2 3; do
            mapfile -t shard < <(awk -v k="$k" 'NR % 4 == k' "$RUNNER_TEMP/slow")
            ../bench/lock/autan-gpu-lock -m "gpu-tests: codegen slow shard $((k + 1))/4" -t 600 -- \
              uv run --locked pytest --backend gpu -q "${shard[@]}"
          done
      - name: Release the GPU lock priority
        if: always()
        run: bench/ci/priority.sh stop
