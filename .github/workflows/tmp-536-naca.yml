# TEMPORARY (#536): the NACA 0012 generator's bytes on x86-64, aarch64 and macOS arm64, compared.
# Deleted before any pull request of #536 is ready.
name: tmp-536-naca
on:
  pull_request:
    paths:
      - .github/workflows/tmp-536-naca.yml
      - .github/tmp-536/**
      - vv/src/autan_vv/meshes/naca0012.py
permissions: {}
jobs:
  sha:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Level 32 (sha), 128 and 512 (time)
        run: uv run --project vv --locked --no-dev python .github/tmp-536/sha.py "sha-${{ matrix.os }}.txt" 32 128 512
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha-${{ matrix.os }}
          path: sha-*.txt
  compare:
    needs: sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Same bytes on every platform
        run: |
          for f in sha-*.txt; do echo "== $f"; cat "$f"; done
          n=$(for f in sha-*.txt; do grep '^nc' "$f" | cut -d' ' -f1-6; done | sort -u | wc -l)
          echo "distinct (level, sha) lines: $n (3 expected, one per level)"
          test "$n" -eq 3
