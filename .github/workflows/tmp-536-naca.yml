# TEMPORARY (#536): naca0012.plane_grid's intermediate arrays on x86-64 and aarch64, compared bit for
# bit. Deleted before any pull request of #536 is ready.
name: tmp-536-naca
on:
  pull_request:
    paths: [.github/workflows/tmp-536-naca.yml]
permissions: {}
jobs:
  dump:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Dump level 32
        run: uv run --project vv --locked --no-dev python .github/tmp-536/dump.py 32 "dump-$(uname -m).npz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dump-${{ matrix.os }}
          path: dump-*.npz
  compare:
    needs: dump
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Compare
        run: uv run --project vv --locked --no-dev python .github/tmp-536/compare.py dump-x86_64.npz dump-aarch64.npz
