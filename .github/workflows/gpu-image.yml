# Builds the dev image (docker/dev) for amd64 and arm64 on GitHub-hosted runners, runs the
# image smoke test and, on main, publishes ghcr.io/remenby31/autan-dev:<sha> and :main.
name: gpu-image

on:
  push:
    branches: [main]
    paths: [docker/dev/**, .github/workflows/gpu-image.yml]
  pull_request:
    paths: [docker/dev/**, .github/workflows/gpu-image.yml]
  workflow_dispatch:

permissions: {}

# An image build takes about an hour and saves its layer cache only when it finishes:
# queue builds instead of cancelling them.
concurrency:
  group: gpu-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/remenby31/autan-dev
  PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write # push the image to GHCR on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space for the CUDA base image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/dev
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: autan-dev:ci
          build-args: AUTAN_IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=dev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.arch }}
      - name: Smoke test (CPU; CUDA code compiled, not run)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:ro" autan-dev:ci
          env CUDA_ARCHITECTURES="120;121" /src/docker/dev/smoke/run.sh /tmp/smoke
      - name: Build the solver
        if: hashFiles('CMakeLists.txt') != ''
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:ro" autan-dev:ci
          sh -c 'cmake -S /src -B /tmp/build -DCMAKE_CUDA_ARCHITECTURES="120;121" && cmake --build /tmp/build'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the single-architecture image
        if: env.PUBLISH == 'true'
        run: |
          docker tag autan-dev:ci "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}"
          docker push "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}"

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the image to GHCR on main
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture image
        run: >-
          docker buildx imagetools create
          -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:main"
          "$IMAGE:${GITHUB_SHA}-amd64" "$IMAGE:${GITHUB_SHA}-arm64"
