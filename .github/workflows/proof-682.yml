# Throwaway diagnosis for #682 on the hosted arm64 runner; never merged.
name: proof-682
on:
  push:
    branches: [proof/682-hosted]
permissions:
  contents: read
  packages: read
env:
  CONFIGURE: >-
    -G Ninja -DAUTAN_ENABLE_CUDA=ON -DAUTAN_ENABLE_MPI=ON
    -DAUTAN_ENABLE_METIS=ON -DAUTAN_ENABLE_SCOTCH=ON -DCMAKE_CUDA_ARCHITECTURES=121
    -DAUTAN_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release
    -DCMAKE_CXX_FLAGS_RELEASE=-O2 -DCMAKE_CUDA_FLAGS_RELEASE=-O2
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        mode: [alone, shard2]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: ghcr.io/remenby31/autan-dev@sha256:95e7b65c4e7a8c6514e2b96159a20a1739b12b29b60be6a1ee44b30a226af601
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --memory 16g
    defaults:
      run:
        shell: bash
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
      PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,sm
      OMPI_MCA_osc: ^ucx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Host
        run: |
          uname -a; getconf PAGESIZE; nproc; free -m
          for f in /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag /sys/kernel/mm/transparent_hugepage/shmem_enabled /sys/kernel/mm/transparent_hugepage/hugepages-*/enabled; do echo "$f: $(cat "$f" 2>/dev/null)"; done
          cat /proc/sys/vm/overcommit_memory; mount | grep -E " /tmp | / " || true; df -h /tmp
      - run: |
          # shellcheck disable=SC2086
          cmake -S . -B build $CONFIGURE
      - if: matrix.mode == 'alone'
        run: cmake --build build --target autan_io_tests
      - if: matrix.mode == 'alone'
        name: The six bounds, 30 runs each, alone, with smaps
        run: |
          cd build/tests/io
          for name in "Fluent interior zones no face is in are not kept" "Reading a CGNS file costs at most 1 MiB and 16 KiB a node*" "Reading a CGNS file costs its descriptors*" "Reading a MIXED section costs the elements it keeps*" "Records a reader does not use cost their text*" "Sizes a text reader is told are checked before they are allocated"; do
            f=0
            for i in $(seq 30); do
              AUTAN_PEAK_DEBUG=1 ./autan_io_tests "$name" > "$RUNNER_TEMP/last.log" 2>&1 || { f=$((f+1)); echo "== FAIL $name run $i"; grep -E "peak|before :=|after :=|added :=|expansion|<=|^  [0-9]" "$RUNNER_TEMP/last.log" | head -40; }
              [ "$i" = 1 ] && { echo "== first run of $name"; grep "peak" "$RUNNER_TEMP/last.log" | head -8; }
            done
            echo "RESULT | $name | failures $f/30"
          done
      - if: matrix.mode == 'shard2'
        run: cmake --build build
      - if: matrix.mode == 'shard2'
        name: Shard 2's serial selection at -j 4, three times, test 78 with smaps
        run: |
          bench/ci/cpu-test-shards.py build "$RUNNER_TEMP" 3
          for r in 1 2 3; do
            AUTAN_PEAK_DEBUG=1 ctest --test-dir build -I "$(cat "$RUNNER_TEMP/cpu-2-serial")" -j 4 --output-on-failure > "$RUNNER_TEMP/s$r.log" 2>&1; echo "== round $r exit $?"
            grep -E "tests passed|FAILED|\*\*\*Failed" "$RUNNER_TEMP/s$r.log" | head
            grep -A30 "test_readers.cpp:803" "$RUNNER_TEMP/s$r.log" | head -40 || true
          done
          AUTAN_PEAK_DEBUG=1 ctest --test-dir build -R "Fluent interior zones no face is in are not kept" -V 2>&1 | grep -E "peak|Passed|Failed" | head
