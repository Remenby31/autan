# Runs the GPU tests, the STREAM benchmark and the tracked generated loops on a DGX Spark
# runner, gates each on its GB10 baseline and uploads the results. The workflow runs for every
# change, but its jobs are skipped (which satisfies the required check) unless code that can
# change a measurement changed. Self-hosted runners never run fork pull requests: the job
# condition skips them, and the runner's job-started hook refuses them even if a pull request
# edits this file (docs/infra/runners.md).
name: gpu-bench

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft that becomes ready runs at once; drafts themselves are skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

# A new push to a pull request cancels its older run. Runs on main queue instead: each one measures
# a merged commit, and a later push, even one whose jobs are skipped, must not cancel it.
concurrency:
  group: gpu-bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      bench: ${{ steps.filter.outputs.bench }}
      harness: ${{ steps.filter.outputs.harness }}
      # The bisection's known-good end; looked up here because gh is not in the runner image.
      measured: ${{ steps.measured.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the last commit of main that was measured
        id: measured
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(bench/ci/last-measured.sh)" >> "$GITHUB_OUTPUT"
      - name: Decide whether anything measured changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          MEASURED: ${{ steps.measured.outputs.sha }}
        # No pipe: the default shell has no pipefail, so a failing filter would pass unnoticed.
        run: bench/ci/changes.sh "$EVENT" "$DRAFT" "$MEASURED" >> "$GITHUB_OUTPUT"

  mesh:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    # Gmsh has no linux-aarch64 wheel (docs/validation/meshes.md): the mesh is generated here,
    # on a GitHub-hosted runner, and handed to the Spark job as an artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The mesh is a pure function of the generator, its locked dependencies and its arguments:
      # cached under their hash, it is generated again only when one of them changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mesh-cache
        with:
          path: meshes/
          key: mesh-hex-n128-${{ hashFiles('vv/src/autan_vv/**', 'vv/pyproject.toml', 'vv/uv.lock', 'vv/.python-version') }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.mesh-cache.outputs.cache-hit != 'true'
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install the libraries the Gmsh wheel loads
        if: steps.mesh-cache.outputs.cache-hit != 'true'
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
          libglu1-mesa libxcursor1 libxft2 libxinerama1 libxrender1
      - name: Generate the hexahedral mesh, n = 128 (2.1 M cells)
        if: steps.mesh-cache.outputs.cache-hit != 'true'
        run: uv run --project vv --locked autan-vv meshes hex --levels 128 --out meshes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mesh-hex-n128
          path: meshes/
          retention-days: 1
          if-no-files-found: error

  bench:
    needs: [changes, mesh]
    if: >-
      needs.changes.outputs.bench == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # `bench`: runners whose GPU is not shared with another team's long-running process. Main has
    # its own runner process on the same Spark (`bench-main`, its only label, so no other job can
    # take it), so it never queues behind pull requests in GitHub; on the machine the GPU lock
    # orders them, main first.
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '["self-hosted", "linux", "ARM64", "bench-main"]' || '["self-hosted", "linux", "ARM64", "gpu", "gb10", "bench"]') }}
    # A bisection on main measures up to 8 commits in this job (bench/ci/bisect.py).
    timeout-minutes: ${{ github.event_name == 'pull_request' && 90 || 240 }}
    permissions:
      contents: read
    env:
      AUTAN_BENCH_REQUIRE_GPU: "1"
      # Every wait for the GPU lock fails clearly after 15 minutes instead of waiting forever
      # behind other measurements on the shared Spark.
      AUTAN_BENCH_LOCK_TIMEOUT: "900"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A bisection on main checks out earlier commits of main.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
      - name: Give this job priority on the GPU lock
        # As long as the job may last: a bisection on main keeps the GPU first through its probes.
        run: bench/ci/priority.sh start ${{ github.event_name == 'pull_request' && 90 || 240 }}
      # Builds run under the GPU lock too, briefly: on the bench Spark no measurement ever runs
      # beside a compilation.
      - name: Build the benchmarks
        run: >-
          bench/lock/autan-gpu-lock -m "gpu-bench: build the benchmarks" -t 600 --
          bash -c 'cmake -S bench -B build/bench && cmake --build build/bench'
      - name: Install the harness
        run: uv sync --project bench --locked
      - name: Harness tests on the GPU (bench/ or docker/ changed)
        if: needs.changes.outputs.harness == 'true'
        run: AUTAN_BENCH_STREAM="$PWD/build/bench/stream" uv run --project bench --locked pytest -rs bench/tests docker/runner/tests
      - name: Image smoke test on the GPU (bench/ or docker/ changed)
        if: needs.changes.outputs.harness == 'true'
        run: >-
          REQUIRE_GPU=1 bench/lock/autan-gpu-lock -m "gpu-bench: image smoke test"
          -w "$AUTAN_BENCH_LOCK_TIMEOUT" -t 600 -- docker/dev/smoke/run.sh build/smoke
      - name: STREAM bandwidth
        run: uv run --project bench --locked autan-bench stream --binary build/bench/stream --out results/stream.json
      - name: Compare with the GB10 baseline (failures confirmed by a rerun)
        id: stream-gate
        run: >-
          bench/ci/gate.sh results/stream.json bench/baselines/gb10.json --
          uv run --project bench --locked autan-bench stream --binary build/bench/stream --out results/stream.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mesh-hex-n128
          path: meshes
      - name: Build the generated loops
        run: >-
          bench/lock/autan-gpu-lock -m "gpu-bench: build the generated loops" -t 600 --
          bash -c 'cmake -S . -B build/autan -DAUTAN_ENABLE_CUDA=ON -DAUTAN_BUILD_TESTS=OFF
          -DCMAKE_CUDA_ARCHITECTURES=121 && cmake --build build/autan --target autan_loop_bench'
      - name: Generated loops, hex n = 128, fp32, RCM order
        run: >-
          uv run --project bench --locked autan-bench run --suite codegen
          --binary build/autan/codegen/autan_loop_bench --precision fp32
          --out results/codegen-hex-n128-fp32.json
          -- meshes/hex-n128.msh --policy fp32 --order rcm
      - name: Compare the tracked loops with their GB10 baseline (failures confirmed by a rerun)
        id: loops-gate
        # Its status: 1 only for a regression confirmed by the rerun, which alone starts a bisection.
        run: >-
          bench/ci/gate.sh results/codegen-hex-n128-fp32.json bench/baselines/gb10-codegen-hex-n128-fp32.json --
          uv run --project bench --locked autan-bench run --suite codegen
          --binary build/autan/codegen/autan_loop_bench --precision fp32
          --out results/codegen-hex-n128-fp32.json
          -- meshes/hex-n128.msh --policy fp32 --order rcm || status=$?;
          echo "status=${status:-0}" >> "$GITHUB_OUTPUT"; exit "${status:-0}"
      # A regression of main confirmed by the gate, on a machine that passed STREAM: find its
      # commit here, on this Spark and with this protocol, before the runner takes other jobs.
      - name: Bisect the regression
        if: >-
          failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          steps.stream-gate.outcome == 'success' && steps.loops-gate.outputs.status == '1' &&
          needs.changes.outputs.measured != ''
        env:
          GOOD: ${{ needs.changes.outputs.measured }}
        run: >-
          mkdir -p "results/bisect/$GITHUB_SHA" &&
          cp results/stream.json results/codegen-hex-n128-fp32.json "results/bisect/$GITHUB_SHA/" &&
          python3 bench/ci/bisect.py --good "$GOOD" --bad "$GITHUB_SHA" --out results/bisect
          --compare bench/ci/compare-points.sh
          -- bench/ci/measure-point.sh
      - name: Release the GPU lock priority
        if: always()
        run: bench/ci/priority.sh stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gpu-bench-${{ github.sha }}
          path: results/
          if-no-files-found: error

  report-regression:
    needs: bench
    # Write access only here, on a GitHub-hosted runner and for main, never on the Spark.
    if: >-
      always() && needs.bench.result == 'failure' && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpu-bench-${{ github.sha }}
          path: results
      - name: Open an issue, and comment on the culprit's pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f results/bisect/summary.json ]; then
            python3 bench/ci/report_regression.py results/bisect bench/baselines/gb10-codegen-hex-n128-fp32.json "$RUN_URL"
          else
            echo "No bisection: the failure was not a confirmed regression of the tracked loops."
          fi
