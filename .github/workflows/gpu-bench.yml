# Runs the GPU tests, the STREAM benchmark and the tracked generated loops on a DGX Spark
# runner, gates each on its GB10 baseline and uploads the results. Self-hosted runners never run fork pull requests:
# the job condition below skips them, and the runner's job-started hook refuses them
# even if a pull request edits this file (docs/infra/runners.md).
name: gpu-bench

on:
  push:
    branches: [main]
    paths: &paths
      [bench/**, docker/**, codegen/**, kernels/**, core/**, io/**, CMakeLists.txt, .github/workflows/gpu-bench.yml]
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions: {}

concurrency:
  group: gpu-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesh:
    # Gmsh has no linux-aarch64 wheel (docs/validation/meshes.md): the mesh is generated here,
    # on a GitHub-hosted runner, and handed to the Spark job as an artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install the libraries the Gmsh wheel loads
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
          libglu1-mesa libxcursor1 libxft2 libxinerama1 libxrender1
      - name: Generate the hexahedral mesh, n = 128 (2.1 M cells)
        run: uv run --project vv --locked autan-vv meshes hex --levels 128 --out meshes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mesh-hex-n128
          path: meshes/
          retention-days: 1
          if-no-files-found: error

  bench:
    needs: mesh
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # `bench`: runners whose GPU is not shared with another team's long-running process.
    runs-on: [self-hosted, linux, ARM64, gpu, gb10, bench]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      AUTAN_BENCH_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the benchmarks
        run: cmake -S bench -B build/bench && cmake --build build/bench
      - name: Install the harness
        run: uv sync --project bench --locked
      - name: Tests (CPU and GPU)
        run: AUTAN_BENCH_STREAM="$PWD/build/bench/stream" uv run --project bench --locked pytest -rs bench/tests docker/runner/tests
      - name: Image smoke test on the GPU
        run: REQUIRE_GPU=1 flock /home/admin/autan-gpu/gpu.lock docker/dev/smoke/run.sh build/smoke
      - name: STREAM bandwidth
        run: uv run --project bench --locked autan-bench stream --binary build/bench/stream --out results/stream.json
      - name: Compare with the GB10 baseline (failures confirmed by a rerun)
        run: >-
          bench/ci/gate.sh results/stream.json bench/baselines/gb10.json --
          uv run --project bench --locked autan-bench stream --binary build/bench/stream --out results/stream.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mesh-hex-n128
          path: meshes
      - name: Build the generated loops
        run: >-
          cmake -S . -B build/autan -DAUTAN_ENABLE_CUDA=ON -DAUTAN_BUILD_TESTS=OFF
          -DCMAKE_CUDA_ARCHITECTURES=121 && cmake --build build/autan --target autan_loop_bench
      - name: Generated loops, hex n = 128, fp32, RCM order
        run: >-
          uv run --project bench --locked autan-bench run --suite codegen
          --binary build/autan/codegen/autan_loop_bench --precision fp32
          --out results/codegen-hex-n128-fp32.json
          -- meshes/hex-n128.msh --policy fp32 --order rcm
      - name: Compare the tracked loops with their GB10 baseline (failures confirmed by a rerun)
        run: >-
          bench/ci/gate.sh results/codegen-hex-n128-fp32.json bench/baselines/gb10-codegen-hex-n128-fp32.json --
          uv run --project bench --locked autan-bench run --suite codegen
          --binary build/autan/codegen/autan_loop_bench --precision fp32
          --out results/codegen-hex-n128-fp32.json
          -- meshes/hex-n128.msh --policy fp32 --order rcm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gpu-bench-${{ github.sha }}
          path: results/
          if-no-files-found: error
