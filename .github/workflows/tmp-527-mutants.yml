# TEMPORARY (#527): Noyau's six mutants under libc++'s hardening on macOS. Deleted before ready.
name: tmp-527-mutants
on:
  pull_request:
    paths: [.github/workflows/tmp-527-mutants.yml]
permissions: {}
jobs:
  mutants:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          micromamba-version: 2.3.3-0
          environment-name: cgns
          create-args: -c conda-forge cgns=4.5.2 ninja=1.13.2 metis=5.1.0
          init-shell: none
          cache-downloads: false
          cache-environment: false
      - name: Mutants, hardened against plain
        env:
          CC: clang
          CXX: clang++
        run: |
          export CGNS_PREFIX="${MAMBA_ROOT_PREFIX}/envs/cgns"
          export PATH="${CGNS_PREFIX}/bin:${PATH}"
          python3 .github/tmp-527/mutants.py
