name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A push runs in a group of its own commit: a group holds one pending run, which the next one
# replaces, so in a group shared by pushes a push to main could get no run at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      # The hooks' environments, keyed on the pinned revisions and the interpreter they are built
      # with: a hit clones and downloads nothing.
      - id: python
        run: echo "version=$(python3 -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-4.7.0-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # On a miss the hooks' repositories are cloned from GitHub with the workflow's token, which
      # git holds only for this step. Hooks that download a release themselves (actionlint,
      # shellcheck) take no token: they are retried.
      - name: Install the hooks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          for attempt in 1 2 3; do
            uvx pre-commit@4.7.0 install-hooks && exit 0
            echo "::warning::pre-commit install-hooks failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1
      - name: Run every hook on every file
        env:
          # The branch guard is for local commits; CI also runs on main itself.
          SKIP: no-commit-to-branch
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure --color=always

  cpp:
    name: C++ ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The Linux Debug builds and tests took 9.5 to 19.3 minutes on hosted runners (2026-11-08,
        # #578, #623, #627), and 20 minutes stopped them on main: 35 leaves room for the slower
        # runners.
        include:
          - compiler: gcc
            os: ubuntu-24.04
            timeout: 35
            cc: gcc
            cxx: g++
            hardening: -D_GLIBCXX_ASSERTIONS
          # The supported Clang range (docs/getting-started/build.md): Ubuntu 24.04's (18), the
          # oldest, and a recent one from conda-forge (20), whose warnings come closer to the
          # Mac's Apple Clang.
          - compiler: clang
            os: ubuntu-24.04
            timeout: 35
            cc: clang
            cxx: clang++
            hardening: -D_GLIBCXX_ASSERTIONS
          - compiler: clang-20
            os: ubuntu-24.04
            timeout: 35
            cc: clang
            cxx: clang++
            hardening: -D_GLIBCXX_ASSERTIONS
            conda: clangxx=20.1.8 clang-tools=20.1.8
          # macOS: Apple Clang and libc++, the only place the runtime's tests meet them (the Metal
          # job builds the Metal targets alone): libc++ code paths differ (#516). libc++'s
          # hardening is the counterpart of libstdc++'s assertions. macOS 26 for Xcode 26's libc++,
          # which has the floating-point std::from_chars the mesh readers use.
          - compiler: apple-clang
            os: macos-26
            timeout: 40
            cc: clang
            cxx: clang++
            hardening: -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_DEBUG
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 64-bit, HDF5-backed CGNS 4.5 from conda-forge (Ubuntu 24.04 ships CGNS 3.4, which cannot read CGNS 4 files),
      # and Ninja from the same place, so no job depends on the Ubuntu mirrors.
      - uses: ./.github/actions/micromamba # zizmor: ignore[self-repository]
        with:
          token: ${{ github.token }}
          environment-name: cgns
          # METIS 5.1.0, the dev image's (Ubuntu's): the partitioner's tests hold for it, where
          # 5.2.1 cuts more than slabs on the hybrid box. From conda-forge, so that every compiler,
          # conda-forge's clang included, finds its header and library.
          create-args: -c conda-forge cgns=4.5.2 ninja=1.13.2 metis=5.1.0 ${{ matrix.conda }}
      - name: Put CGNS tools and Ninja on the PATH
        run: |
          grep -q '#define CG_BUILD_64BIT  1' "${MAMBA_ROOT_PREFIX}/envs/cgns/include/cgnstypes.h"
          echo "${MAMBA_ROOT_PREFIX}/envs/cgns/bin" >> "${GITHUB_PATH}"
      - name: Show the compiler
        run: ${CXX} --version
      # The standard library's assertions (libstdc++ on Linux, libc++'s hardening on macOS): a
      # bounds-checked operator[], an asserted *optional, a checked front() and back(). They catch
      # undefined behaviour the tests reach but that neither the Release builds nor
      # AddressSanitizer see (Noyau's mutation runs).
      # METIS too: without it the partitioner's paths are not reached, and its bugs not caught.
      - name: Configure
        env:
          AUTAN_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="${MAMBA_ROOT_PREFIX}/envs/cgns"
          -DCMAKE_BUILD_TYPE=Debug -DAUTAN_WARNINGS_AS_ERRORS=ON -DAUTAN_ENABLE_METIS=ON
          -DCMAKE_CXX_FLAGS=${{ matrix.hardening }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  mpi:
    # The multi-rank tests use no GPU: they run here, on every pull request including drafts,
    # rather than in gpu-tests on the Spark. CUDA-aware exchanges stay in gpu-tests.
    name: MPI ranks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # UCX intermittently fails to start on hosted runners ("pml_ucx.c:319 Error: Failed to create
    # UCP worker", then MPI_ERR_OTHER in MPI_Isend). These are single-node CPU tests: use Open MPI's
    # ob1 PML over shared memory (Open MPI 5 names it sm, formerly vader) and no UCX one-sided.
    env:
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,sm
      OMPI_MCA_osc: ^ucx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Open MPI (BSD-3-Clause) and METIS (Apache-2.0) from conda-forge, like CGNS and Ninja.
      - uses: ./.github/actions/micromamba # zizmor: ignore[self-repository]
        with:
          token: ${{ github.token }}
          environment-name: mpi
          create-args: -c conda-forge cgns=4.5.2 ninja=1.13.2 openmpi=5.0.11 metis=5.2.1
      - name: Put the environment's tools on the PATH
        run: echo "${MAMBA_ROOT_PREFIX}/envs/mpi/bin" >> "${GITHUB_PATH}"
      # The runner has 4 cores and the halo tests go up to 8 ranks.
      - name: Configure with MPI and METIS
        env:
          AUTAN_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="${MAMBA_ROOT_PREFIX}/envs/mpi"
          -DCMAKE_BUILD_TYPE=Release -DAUTAN_WARNINGS_AS_ERRORS=ON
          -DAUTAN_ENABLE_MPI=ON -DAUTAN_ENABLE_METIS=ON -DMPIEXEC_PREFLAGS=--oversubscribe
      - name: Build
        run: cmake --build build
      - name: Install gdb for the hang watchdog
        timeout-minutes: 5
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gdb
      - name: Run the multi-rank tests
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
        run: |
          n=$(ctest --test-dir build -N -L mpi | sed -n 's/^Total Tests: //p')
          echo "$n multi-rank tests (CTest label mpi)"
          [ "$n" -ge 10 ] || { echo "::error::expected at least 10 tests labelled mpi, found $n"; exit 1; }
          # A test normally ends within 25 s: past 120 s the watchdog dumps every rank's stacks
          # and fails it (#304), instead of a hang holding the runner until CTest's timeout.
          bench/ci/ctest-watchdog.sh 120 "$RUNNER_TEMP/mpi-hang-stacks" -- \
            ctest --test-dir build -L mpi --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mpi-hang-stacks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mpi-hang-stacks/
          if-no-files-found: ignore
      # The SDK through a real launcher: autan.SolverBackend starts `mpiexec -n 2` and stops every
      # rank through the stop file (py/tests, marker mpi; deselected in the Python SDK job).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Run the SDK's multi-rank tests
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
        run: |
          set -o pipefail
          uv sync --locked --no-install-project
          uv sync --locked --no-build-isolation
          export AUTAN_RUN_RELAXATION_MPI="$PWD/build/tests/runtime/autan-run-relaxation"
          uv run --locked --no-sync pytest -m mpi -ra py/tests | tee pytest-mpi.log
          if grep -q '^SKIPPED' pytest-mpi.log; then echo "::error::the SDK's MPI tests must run, not skip"; exit 1; fi
          grep -Eq '^=+ [1-9][0-9]* passed' pytest-mpi.log || { echo "::error::no SDK MPI test passed"; exit 1; }

  bench-harness:
    # autan-bench and the runner hook, without a GPU (the GPU tests skip here and run in gpu-bench).
    name: Bench harness
    runs-on: ubuntu-24.04
    # The suite takes most of 10 minutes on a hosted runner: 20 leaves room for the next tests.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - run: uv run --project bench --locked pytest -rs bench/tests docker/runner/tests docker/host-guard/tests

  ui:
    # No path filter: the UI reads the SDK, the contracts and the fake backend, which live outside ui/.
    name: UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: website/package.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - run: bun install --frozen-lockfile
      # The server's build backend (hatchling, editables) comes from its uv.lock, not from an
      # isolated build environment; Vitest's surface test runs the server too.
      - name: Install the server from its lock file
        working-directory: ui/server
        run: |
          uv sync --locked --no-install-project --no-install-package autan
          uv sync --locked --no-build-isolation
      - name: Lint (Biome)
        run: bunx biome ci .
      - name: Type-check
        run: bunx tsc --noEmit -p .
      - name: Unit tests (Vitest)
        run: bun run test
      - name: Server type-check (mypy)
        working-directory: ui/server
        run: uv run --locked --no-sync mypy
      - name: Server tests (pytest)
        working-directory: ui/server
        run: uv run --locked --no-sync python -m pytest -q tests
      # Headless Chrome, preinstalled on the runner (playwright.config.ts uses channel "chrome");
      # WebGL2, since there is no WebGPU without a GPU.
      - name: End-to-end tests (Playwright)
        env:
          AUTAN_UI_E2E_BACKEND: webgl2
        run: bun run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui/test-results/
          if-no-files-found: ignore

  ui-golden:
    # The UI driven on what the solver itself writes: autan-mesh-info and autan-run (CPU) produce
    # a mesh's MeshInfo and surface and two runs, which the golden-path e2e reads.
    name: UI golden path
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: website/package.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: ./.github/actions/micromamba # zizmor: ignore[self-repository]
        with:
          token: ${{ github.token }}
          environment-name: cgns
          create-args: -c conda-forge cgns=4.5.2 ninja=1.13.2
      - name: Put CGNS tools and Ninja on the PATH
        run: |
          grep -q '#define CG_BUILD_64BIT  1' "${MAMBA_ROOT_PREFIX}/envs/cgns/include/cgnstypes.h"
          echo "${MAMBA_ROOT_PREFIX}/envs/cgns/bin" >> "${GITHUB_PATH}"
      - name: Build autan-run and autan-mesh-info
        env:
          AUTAN_GITHUB_TOKEN: ${{ github.token }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="${MAMBA_ROOT_PREFIX}/envs/cgns" -DCMAKE_BUILD_TYPE=Release -DAUTAN_BUILD_TESTS=OFF
          cmake --build build --target autan-run autan-mesh-info
      - name: Install the UI
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Install the server from its lock file
        working-directory: ui/server
        run: |
          uv sync --locked --no-install-project --no-install-package autan
          uv sync --locked --no-build-isolation
      - name: Golden path (Playwright on the solver's own output)
        working-directory: ui
        env:
          AUTAN_RUN: ${{ github.workspace }}/build/runtime/autan-run
          AUTAN_MESH_INFO: ${{ github.workspace }}/build/io/autan-mesh-info
        run: bun run e2e:golden
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-golden-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui/test-results/
          if-no-files-found: ignore

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install clang-tidy
        run: uv tool install clang-tidy==23.1.4
      # 64-bit, HDF5-backed CGNS 4.5 from conda-forge (Ubuntu 24.04 ships CGNS 3.4, which cannot read CGNS 4 files),
      # and Ninja from the same place, so no job depends on the Ubuntu mirrors.
      - uses: ./.github/actions/micromamba # zizmor: ignore[self-repository]
        with:
          token: ${{ github.token }}
          environment-name: cgns
          create-args: -c conda-forge cgns=4.5.2 ninja=1.13.2
      - name: Put CGNS tools and Ninja on the PATH
        run: |
          grep -q '#define CG_BUILD_64BIT  1' "${MAMBA_ROOT_PREFIX}/envs/cgns/include/cgnstypes.h"
          echo "${MAMBA_ROOT_PREFIX}/envs/cgns/bin" >> "${GITHUB_PATH}"
      - name: Configure
        env:
          AUTAN_GITHUB_TOKEN: ${{ github.token }}
        run: cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="${MAMBA_ROOT_PREFIX}/envs/cgns" -DAUTAN_BUILD_TESTS=OFF
      - name: Analyse the core, the readers and the mesh tools
        run: run-clang-tidy.py -p build -quiet 'core/src/.*|io/src/.*|io/tools/.*'

  sdk:
    name: Python SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      # 64-bit, HDF5-backed CGNS 4.5 from conda-forge (Ubuntu 24.04 ships CGNS 3.4, which cannot read CGNS 4 files),
      # and Ninja from the same place, so no job depends on the Ubuntu mirrors.
      - uses: ./.github/actions/micromamba # zizmor: ignore[self-repository]
        with:
          token: ${{ github.token }}
          environment-name: cgns
          create-args: -c conda-forge cgns=4.5.2 ninja=1.13.2
      - name: Put CGNS tools and Ninja on the PATH
        run: |
          grep -q '#define CG_BUILD_64BIT  1' "${MAMBA_ROOT_PREFIX}/envs/cgns/include/cgnstypes.h"
          echo "${MAMBA_ROOT_PREFIX}/envs/cgns/bin" >> "${GITHUB_PATH}"
      # The SDK's contract tests run the real C++ producers (autan-mesh-info, autan-run and the test
      # runtimes); building everything keeps this job independent of their target names.
      - name: Build the C++ tools the SDK tests run
        env:
          AUTAN_GITHUB_TOKEN: ${{ github.token }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="${MAMBA_ROOT_PREFIX}/envs/cgns" -DCMAKE_BUILD_TYPE=Release -DAUTAN_BUILD_TESTS=ON
          cmake --build build
      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install from the lock file
        # The build backend (hatchling, editables) comes from uv.lock too, not from an isolated build env.
        run: |
          uv sync --locked --no-install-project
          uv sync --locked --no-build-isolation
      - name: Type-check
        run: uv run --locked --no-sync mypy
      - name: Test, failing on any skipped test
        run: |
          set -o pipefail
          command -v cgnscheck
          uv run --locked --no-sync pytest -ra | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then echo "::error::CI must run every test; see the SKIPPED lines above."; exit 1; fi

  vv:
    name: V&V
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check
      # The Gmsh wheel links the system OpenGL utility library. Short network timeouts and a step
      # timeout make a stalled Ubuntu mirror fail fast instead of eating the job's time.
      - name: Install libGLU for Gmsh
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install --yes --no-install-recommends libglu1-mesa
      - name: Install from the lock file, Gmsh included
        run: uv sync --locked --all-groups
      - name: Type-check
        run: uv run --locked --no-sync mypy
      # Tests marked "network" download reference data; they run on demand, not on every PR.
      - name: Test, failing on any skipped test
        run: |
          set -o pipefail
          uv run --locked --no-sync pytest -m "not network" -ra | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then echo "::error::CI must run every test; see the SKIPPED lines above."; exit 1; fi
