# TEMPORARY (#495): the ns-mms-order gate's Gmsh families on two x86-64 runners and on macOS arm64.
# Deleted before this pull request is ready.
name: tmp-495-platforms
on:
  pull_request:
    paths: [.github/workflows/tmp-495-platforms.yml]
permissions: {}
jobs:
  gate-families:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, instance: x86-a}
          - {os: ubuntu-24.04, instance: x86-b}
          - {os: macos-15, instance: macos}
    name: ${{ matrix.instance }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Gmsh's libraries (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
          libglu1-mesa libxcursor1 libxft2 libxinerama1 libxrender1
      - name: The gate's Gmsh families, perturbed 0.3, seed 2026
        working-directory: vv
        run: |
          grep -m1 "model name" /proc/cpuinfo 2>/dev/null || sysctl -n machdep.cpu.brand_string
          for spec in "tet 4,6,16,24,32,48" "poly 4,6,16,24,32,48,64"; do
            read -r kind levels <<< "$spec"
            uv run --locked autan-vv meshes "$kind" --levels "$levels" --perturbation 0.3 --seed 2026 --out "$RUNNER_TEMP/$kind" > /dev/null
            (cd "$RUNNER_TEMP/$kind" && shasum -a 256 -- * | sed "s/^/FAMILY $kind /")
          done
