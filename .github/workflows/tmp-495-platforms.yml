# TEMPORARY (#495): measures the perturbation's golden values on three platforms and re-measures
# docs/validation/order.md's perturbed rows. Deleted before this pull request is ready.
name: tmp-495-platforms
on:
  pull_request:
    paths: [.github/workflows/tmp-495-platforms.yml]
permissions: {}
jobs:
  golden:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Gmsh's libraries (x86 Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
          libglu1-mesa libxcursor1 libxft2 libxinerama1 libxrender1
      - name: Golden values
        working-directory: vv
        run: |
          uname -m
          uv run --locked python - <<'PY'
          import hashlib, importlib.util, pathlib, tempfile
          import numpy as np
          from autan_vv.meshes import families as F
          print("numpy", np.__version__)
          np.show_runtime()
          p, c = F._structured_hybrid(6)
          m = F.perturb(p, c, F._box_boundary(p, c), 0.3, seed=2026)
          print("GOLDEN hybrid-n6", hashlib.sha256(m.astype("<f8").tobytes()).hexdigest())
          if importlib.util.find_spec("gmsh"):
              d = pathlib.Path(tempfile.mkdtemp())
              for kind in ("tet", "hex", "hybrid", "poly"):
                  path = d / f"{kind}.{'msh' if kind != 'poly' else 'msh'}"
                  F.generate_level(kind, 6, perturbation=0.3, seed=2026, path=path)
                  print(f"GOLDEN {kind}-file-n6", hashlib.sha256(path.read_bytes()).hexdigest())
          else:
              print("GOLDEN no gmsh on this platform")
          PY
      - name: Re-measure docs/validation/order.md's perturbed rows (macOS arm64, as the table)
        if: matrix.os == 'macos-15'
        working-directory: vv
        run: |
          for spec in "tet 8,16,24,32" "hex 8,16,32,48" "prism 8,16,24,32" "hybrid 6,12,24,36" "poly 8,16,24,32" "agglomerated 8,16,24,32"; do
            read -r kind levels <<< "$spec"
            uv run --locked autan-vv reference "$kind" --levels "$levels" --perturbation 0.3 --seed 2026 --out "$RUNNER_TEMP/ref-$kind" > "$RUNNER_TEMP/ref-$kind.txt"
            echo "ORDER $kind $levels: $(tr '\n' ' ' < "$RUNNER_TEMP/ref-$kind.txt")"
            uv run --locked python -c "import json, sys, pathlib; r = json.loads(next(pathlib.Path(sys.argv[1]).glob('*.json')).read_text()); lv = r.get('levels', [{}])[-1]; print('ORDER', sys.argv[2], 'finest cells', lv.get('n_cells'))" "$RUNNER_TEMP/ref-$kind" "$kind" || true
          done
