# Builds the SDK wheel and the native probe wheels (CUDA fatbin on Linux, CPU on macOS), then
# installs them with install.sh on clean systems and runs `autan doctor` and `autan-probe`.
# release-testpypi.yml calls this workflow and publishes what it builds.
name: wheels

on:
  pull_request:
    paths: [install.sh, packaging/**, pyproject.toml, py/**, .github/workflows/wheels.yml]
  push:
    branches: [main]
    paths: [install.sh, packaging/**, pyproject.toml, py/**, .github/workflows/wheels.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version written to version.txt before the SDK build (TestPyPI dev releases)
        type: string
        default: ""

permissions: {}

concurrency:
  group: wheels-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: SDK wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Set the release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" > version.txt
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdk
          path: dist/
          if-no-files-found: error

  probe:
    name: Probe wheel (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: packaging/probe
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-probe-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  install:
    name: install.sh on ${{ matrix.name }}
    needs: [sdk, probe]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-24.04 x86_64, runner: ubuntu-24.04, image: "ubuntu:24.04" }
          - { name: debian-12 aarch64, runner: ubuntu-24.04-arm, image: "debian:12" }
          - { name: rockylinux-8 x86_64, runner: ubuntu-24.04, image: "rockylinux:8" }
          - { name: macos-15 arm64, runner: macos-15, image: "" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: wheelhouse
          merge-multiple: true
      - name: Install and check in a fresh container, as an unprivileged user
        if: matrix.image != ''
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/w:ro" "$IMAGE" sh /w/packaging/test-install.sh /w
      - name: Install and check with an empty home directory
        if: matrix.image == ''
        run: |
          home=$(mktemp -d)
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin sh packaging/test-install.sh "$PWD"

  offline:
    name: Offline wheelhouse (${{ matrix.target }})
    needs: [sdk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-sdk
          path: dist
      - name: Build the wheelhouse
        env:
          TARGET: ${{ matrix.target }}
        run: sh packaging/wheelhouse.sh wheelhouse "$TARGET" dist
      - name: Install with networking disabled
        run: >-
          docker run --rm --network none -v "$PWD/wheelhouse:/w:ro" ubuntu:24.04 sh -c
          'useradd -m u && su u -c "cd && AUTAN_OFFLINE=1 AUTAN_FIND_LINKS=/w sh /w/install.sh
          && ~/.local/bin/autan version"'

  refuse:
    name: install.sh refuses ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["alpine:3.22", "ubuntu:18.04"]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Expect a clear refusal before anything is downloaded
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if docker run --rm -v "$PWD:/w:ro" "$IMAGE" sh /w/install.sh 2>err.txt; then
            echo "install.sh accepted $IMAGE" >&2
            exit 1
          fi
          cat err.txt
          grep -q "autan-install: error:" err.txt

  gpu:
    name: GPU check on DGX Spark
    needs: [sdk, probe]
    # Self-hosted runner (docs/infra/runners.md): never for pull requests from forks.
    if: >-
      vars.AUTAN_SPARK_WHEELS == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, ARM64, gpu, gb10]
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AUTAN_NO_MODIFY_PATH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: wheelhouse
          merge-multiple: true
      - name: Give this job priority on the GPU lock
        run: bench/ci/priority.sh start 15
      - name: Install with install.sh in an empty home, and require native GPU code on GB10
        # Jobs run in the runner container (no Docker); the GPU lock is mounted there.
        run: |
          home=$(mktemp -d "$RUNNER_TEMP/home.XXXXXX")
          echo "AUTAN_TEST_HOME=$home" >> "$GITHUB_ENV"
          # Like a user's machine: an empty home (and scratch space under it, removed with the
          # job's temp directory) and none of the dev image's uv settings.
          flock /home/admin/autan-gpu/gpu.lock env -u UV_PYTHON -u UV_PYTHON_DOWNLOADS -u UV_CACHE_DIR -u XDG_DATA_HOME \
            HOME="$home" TMPDIR="$home" REQUIRE_GPU=1 sh packaging/test-install.sh "$PWD"
      - name: Name the GPU's other tenants
        # A GPU taken by another team's stack fails the install check with a bare out-of-memory.
        if: failure()
        run: bench/ci/gpu-tenants.sh
      - name: Release the GPU lock priority
        if: always()
        run: bench/ci/priority.sh stop
      - name: With no GPU visible, the probe falls back to the CPU and still passes
        run: |
          CUDA_VISIBLE_DEVICES="" HOME="$AUTAN_TEST_HOME" \
            "$AUTAN_TEST_HOME/.local/bin/autan-probe" --json > probe-nogpu.json
          python3 - probe-nogpu.json <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          gpu = [c for c in doc["checks"] if c["name"].startswith("gpu")]
          assert doc["ok"], doc
          assert doc["cuda"]["driver_version"] > 0 and not doc["cuda"]["devices"], doc["cuda"]
          assert [c["status"] for c in gpu] == ["info"], gpu
          PY
