# Builds the SDK wheel and the native probe wheels (CUDA fatbin on Linux, CPU on macOS), then
# installs them with install.sh on clean systems and runs `autan doctor` and `autan-probe`.
# release-testpypi.yml calls this workflow and publishes what it builds.
name: wheels

on:
  pull_request:
    paths: [install.sh, packaging/**, pyproject.toml, py/**, .github/workflows/wheels.yml]
  push:
    branches: [main]
    paths: [install.sh, packaging/**, pyproject.toml, py/**, .github/workflows/wheels.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version written to version.txt before the SDK build (TestPyPI dev releases)
        type: string
        default: ""

permissions: {}

concurrency:
  group: wheels-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: SDK wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Set the release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" > version.txt
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdk
          path: dist/
          if-no-files-found: error

  probe:
    name: Probe wheel (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: packaging/probe
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-probe-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  install:
    name: install.sh on ${{ matrix.name }}
    needs: [sdk, probe]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-24.04 x86_64, runner: ubuntu-24.04, image: "ubuntu:24.04" }
          - { name: debian-12 aarch64, runner: ubuntu-24.04-arm, image: "debian:12" }
          - { name: rockylinux-8 x86_64, runner: ubuntu-24.04, image: "rockylinux:8" }
          - { name: macos-15 arm64, runner: macos-15, image: "" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: wheelhouse
          merge-multiple: true
      - name: Install and check in a fresh container, as an unprivileged user
        if: matrix.image != ''
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/w:ro" "$IMAGE" sh /w/packaging/test-install.sh /w
      - name: Install and check with an empty home directory
        if: matrix.image == ''
        run: |
          home=$(mktemp -d)
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin sh packaging/test-install.sh "$PWD"

  refuse:
    name: install.sh refuses ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["alpine:3.22", "ubuntu:18.04"]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Expect a clear refusal before anything is downloaded
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if docker run --rm -v "$PWD:/w:ro" "$IMAGE" sh /w/install.sh 2>err.txt; then
            echo "install.sh accepted $IMAGE" >&2
            exit 1
          fi
          cat err.txt
          grep -q "autan-install: error:" err.txt

  gpu:
    name: GPU check on DGX Spark
    needs: [sdk, probe]
    # Self-hosted runner: never for pull requests from forks. Enabled once the runner exists.
    if: >-
      vars.AUTAN_SPARK_RUNNER == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, arm64, gpu, gb10]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: wheelhouse
          merge-multiple: true
      - name: Install in a fresh container that sees only the driver, and require native GPU code
        run: >-
          flock /tmp/cfd-gpu.lock docker run --rm --gpus all --name "autan-wheels-${GITHUB_RUN_ID}"
          -e REQUIRE_GPU=1 -v "$PWD:/w:ro" ubuntu:24.04 sh /w/packaging/test-install.sh /w
