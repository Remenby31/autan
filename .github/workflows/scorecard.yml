# The official OpenSSF Scorecard workflow (ossf/scorecard-action examples/scorecard.yml), pinned.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "15 14 * * 0"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
cache-mode: none

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write # Upload SARIF to GitHub code scanning.
      id-token: write # Sign results published to api.scorecard.dev.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ always() }}
        with:
          sarif_file: results.sarif
