name: Docs

on:
  pull_request:
    paths:
      - website/**
      - docs/**
      - README.md
      - README.fr.md
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - README.md
      - README.fr.md
      - .github/workflows/docs.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: this job builds the artifact that the deploy job publishes.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: website/package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun scripts/translations.ts check
      # In an empty network namespace, so the build (Node and Bun) cannot depend on the network.
      - name: Build without the network
        # Loopback only (prerendering serves the app locally). sudo resets PATH (secure_path),
        # so bun is called by its absolute path.
        run: >-
          sudo unshare --net -- sh -c 'ip link set lo up && exec "$@"' sh
          sudo --preserve-env=PATH,HOME -u "$(id -un)" "$(command -v bun)" run build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # Publish the artifact to GitHub Pages.
      id-token: write # Prove to Pages that the artifact comes from this workflow run.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
