# TEMPORARY (#534): "A run logs the memory it used", 40 times on macos-26, before and after the fix.
# Deleted before this pull request is ready.
name: tmp-534-macos
on:
  pull_request:
    paths: [.github/workflows/tmp-534-macos.yml]
permissions: {}
jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    name: ${{ matrix.variant }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The code before the fix (main at this pull request's base)
        if: matrix.variant == 'before'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git checkout -q "$BASE" -- runtime/src/run.cpp
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          micromamba-version: 2.3.3-0
          environment-name: cgns
          create-args: -c conda-forge cgns=4.5.2 ninja=1.13.2 metis=5.1.0
          init-shell: none
          cache-downloads: false
          cache-environment: false
      - name: Build, then run the test 40 times
        env:
          CC: clang
          CXX: clang++
        run: |
          export PATH="${MAMBA_ROOT_PREFIX}/envs/cgns/bin:${PATH}"
          grep -c "ledger_phys_footprint_peak" runtime/src/run.cpp || true
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="${MAMBA_ROOT_PREFIX}/envs/cgns" -DCMAKE_BUILD_TYPE=Debug -DAUTAN_ENABLE_METIS=ON > /dev/null
          cmake --build build --target autan_runtime_tests autan-run autan-run-relaxation > /dev/null
          fails=0
          for i in $(seq 40); do
            if ! (cd build && tests/runtime/autan_runtime_tests "A run logs the memory it used" > "/tmp/run-$i.txt" 2>&1); then
              fails=$((fails + 1)); grep -A3 "with expansion" "/tmp/run-$i.txt" | head -4
            fi
          done
          echo "RESULT ${{ matrix.variant }}: $fails failures out of 40"
