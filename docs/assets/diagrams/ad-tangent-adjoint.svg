<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 296" role="img" aria-labelledby="ad-tangent-adjoint-title ad-tangent-adjoint-desc" font-family="var(--font-sans, ui-sans-serif, system-ui, sans-serif)" font-size="13"><title id="ad-tangent-adjoint-title">Tangent and adjoint of the residual</title><desc id="ad-tangent-adjoint-desc">The residual R(u) is a sequence of loops: gradient, face flux, boundary. Its tangent runs the differentiated loops in the same order and maps a perturbation δu to J δu. Its adjoint runs the transposed loops in reverse order and maps a seed λ to Jᵀλ. The dot-product identity checks that the two agree.</desc><style>@media (prefers-color-scheme: dark){svg{--accent:#4c9dff;--bg-0:#0a0a0b;--danger:#ff5c5c;--fg:#ededef;--fg-2:#a1a1aa;--fg-3:#85858f}}</style><defs><marker id="ad-tangent-adjoint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><text x="20" y="24" text-anchor="start" fill="var(--fg-3, #707078)" font-size="11">primal</text><rect x="150" y="32" width="110" height="40" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--fg-3, #707078)" stroke-width="1.5"/><text x="205" y="57" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="12">gradient</text><rect x="290" y="32" width="110" height="40" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--fg-3, #707078)" stroke-width="1.5"/><text x="345" y="57" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="12">face flux</text><rect x="430" y="32" width="110" height="40" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--fg-3, #707078)" stroke-width="1.5"/><text x="485" y="57" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="12">boundary</text><line x1="260" y1="52" x2="288" y2="52" stroke="var(--fg-3, #707078)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><line x1="400" y1="52" x2="428" y2="52" stroke="var(--fg-3, #707078)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><text x="110" y="57" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="15" font-style="italic">u</text><line x1="120" y1="52" x2="148" y2="52" stroke="var(--fg-2, #52525b)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><line x1="540" y1="52" x2="568" y2="52" stroke="var(--fg-2, #52525b)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><text x="596" y="57" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="15" font-style="italic">R(u)</text><text x="20" y="104" text-anchor="start" fill="var(--accent, #0a66d8)" font-size="11">tangent</text><rect x="150" y="112" width="110" height="40" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--accent, #0a66d8)" stroke-width="1.5"/><text x="205" y="137" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="12">gradient</text><rect x="290" y="112" width="110" height="40" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--accent, #0a66d8)" stroke-width="1.5"/><text x="345" y="137" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="12">face flux</text><rect x="430" y="112" width="110" height="40" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--accent, #0a66d8)" stroke-width="1.5"/><text x="485" y="137" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="12">boundary</text><line x1="260" y1="132" x2="288" y2="132" stroke="var(--accent, #0a66d8)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><line x1="400" y1="132" x2="428" y2="132" stroke="var(--accent, #0a66d8)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><text x="110" y="137" text-anchor="middle" fill="var(--accent, #0a66d8)" font-size="15" font-style="italic">δu</text><line x1="120" y1="132" x2="148" y2="132" stroke="var(--accent, #0a66d8)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><line x1="540" y1="132" x2="568" y2="132" stroke="var(--accent, #0a66d8)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><text x="596" y="137" text-anchor="middle" fill="var(--accent, #0a66d8)" font-size="15" font-style="italic">J δu</text><text x="20" y="184" text-anchor="start" fill="var(--danger, #c4161c)" font-size="11">adjoint</text><rect x="150" y="192" width="110" height="40" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--danger, #c4161c)" stroke-width="1.5"/><text x="205" y="217" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="12">gradientᵀ</text><rect x="290" y="192" width="110" height="40" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--danger, #c4161c)" stroke-width="1.5"/><text x="345" y="217" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="12">face fluxᵀ</text><rect x="430" y="192" width="110" height="40" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--danger, #c4161c)" stroke-width="1.5"/><text x="485" y="217" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="12">boundaryᵀ</text><line x1="288" y1="212" x2="262" y2="212" stroke="var(--danger, #c4161c)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><line x1="428" y1="212" x2="402" y2="212" stroke="var(--danger, #c4161c)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><text x="100" y="217" text-anchor="middle" fill="var(--danger, #c4161c)" font-size="15" font-style="italic">Jᵀλ</text><line x1="148" y1="212" x2="126" y2="212" stroke="var(--danger, #c4161c)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><line x1="568" y1="212" x2="542" y2="212" stroke="var(--danger, #c4161c)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ad-tangent-adjoint-arrow)"/><text x="596" y="217" text-anchor="middle" fill="var(--danger, #c4161c)" font-size="15" font-style="italic">λ</text><text x="330" y="268" text-anchor="middle" fill="var(--fg-2, #52525b)" font-size="14" font-style="italic">⟨λ, J δu⟩ = ⟨Jᵀλ, δu⟩</text><text x="330" y="286" text-anchor="middle" fill="var(--fg-3, #707078)" font-size="11">dot-product test</text></svg>
