<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 226" role="img" aria-labelledby="architecture-title architecture-desc" font-family="var(--font-sans, ui-sans-serif, system-ui, sans-serif)" font-size="13"><title id="architecture-title">Autan components</title><desc id="architecture-desc">Mesh files go through the readers in io/ into the face-based mesh of core/, which sends a MeshInfo summary to the Python SDK. The SDK checks the case and hands the solver input to the runtime autan-run, which drives the physics whose kernels codegen/ emits for CUDA, HIP and CPU. The runtime writes a run directory that the results API, the UI and V&amp;V read. Each component is tagged with its milestone.</desc><style>@media (prefers-color-scheme: dark){svg{--accent:#4c9dff;--bg-0:#0a0a0b;--fg:#ededef;--fg-2:#a1a1aa;--fg-3:#85858f;--line:#26262b;--line-strong:#3a3a41}}</style><defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><text x="20" y="24" text-anchor="start" fill="var(--fg-3, #707078)" font-size="11">mesh file</text><rect x="20" y="32" width="110" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line, #e4e4e7)" stroke-width="1.5"/><text x="75" y="51" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12" font-weight="600">.msh .cgns</text><text x="75" y="67" text-anchor="middle" fill="var(--fg-3, #707078)" font-size="11">polyMesh</text><text x="20" y="124" text-anchor="start" fill="var(--fg-3, #707078)" font-size="11">case</text><rect x="20" y="132" width="110" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line, #e4e4e7)" stroke-width="1.5"/><text x="75" y="158" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12" font-weight="600">.py .toml</text><rect x="170" y="32" width="110" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line-strong, #d1d1d6)" stroke-width="1.5"/><text x="225" y="51" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12" font-weight="600">io/</text><text x="225" y="67" text-anchor="middle" fill="var(--fg-3, #707078)" font-size="11">readers</text><text x="274" y="26" text-anchor="end" fill="var(--fg-3, #707078)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="10">M0</text><rect x="320" y="32" width="120" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line-strong, #d1d1d6)" stroke-width="1.5"/><text x="380" y="51" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12" font-weight="600">core/</text><text x="380" y="67" text-anchor="middle" fill="var(--fg-3, #707078)" font-size="11">Mesh, partition</text><text x="434" y="26" text-anchor="end" fill="var(--fg-3, #707078)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="10">M0</text><rect x="170" y="132" width="270" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line-strong, #d1d1d6)" stroke-width="1.5"/><text x="305" y="151" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12" font-weight="600">py/  autan</text><text x="305" y="167" text-anchor="middle" fill="var(--fg-3, #707078)" font-size="11">Case · plan · Results</text><text x="434" y="126" text-anchor="end" fill="var(--fg-3, #707078)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="10">M0, M4</text><rect x="480" y="32" width="140" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line-strong, #d1d1d6)" stroke-width="1.5"/><text x="550" y="51" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12" font-weight="600">runtime/ physics/</text><text x="550" y="67" text-anchor="middle" fill="var(--fg-3, #707078)" font-size="11">autan-run · kernels</text><text x="614" y="26" text-anchor="end" fill="var(--fg-3, #707078)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="10">M2–M3</text><rect x="480" y="132" width="140" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line-strong, #d1d1d6)" stroke-width="1.5"/><text x="550" y="151" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12" font-weight="600">codegen/</text><text x="550" y="167" text-anchor="middle" fill="var(--fg-3, #707078)" font-size="11">CUDA · HIP · CPU</text><text x="614" y="126" text-anchor="end" fill="var(--fg-3, #707078)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="10">M1</text><rect x="660" y="82" width="110" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--accent, #0a66d8)" stroke-width="1.5"/><text x="715" y="101" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12" font-weight="600">run dir</text><text x="715" y="117" text-anchor="middle" fill="var(--fg-3, #707078)" font-size="11">autan.results/1</text><rect x="660" y="170" width="110" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line-strong, #d1d1d6)" stroke-width="1.5"/><text x="715" y="196" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-size="12" font-weight="600">UI · V&amp;V</text><line x1="130" y1="54" x2="168" y2="54" stroke="var(--fg-2, #52525b)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#architecture-arrow)"/><line x1="280" y1="54" x2="318" y2="54" stroke="var(--fg-2, #52525b)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#architecture-arrow)"/><line x1="130" y1="154" x2="168" y2="154" stroke="var(--fg-2, #52525b)" stroke-width="1.5" stroke-linecap="round" marker-en