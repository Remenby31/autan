<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-labelledby="mesh-faces-title mesh-faces-desc" font-family="var(--font-sans, ui-sans-serif, system-ui, sans-serif)" font-size="13"><title id="mesh-faces-title">Owner and neighbour of a face</title><desc id="mesh-faces-desc">Two polyhedral cells share face f. Its area vector S_f points from the owner cell to the neighbour cell. A boundary face has only an owner, and its normal points out of the domain into a face zone.</desc><style>@media (prefers-color-scheme: dark){svg{--accent:#4c9dff;--bg-1:#111113;--fg:#ededef;--fg-2:#a1a1aa}}</style><defs><marker id="mesh-faces-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><polygon points="120,60 225,40 305,85 295,180 205,208 125,168" fill="var(--bg-1, #fafafa)" stroke="var(--fg, #0a0a0b)" stroke-width="1.5" stroke-linejoin="round"/><polygon points="305,85 400,52 480,100 470,192 380,218 295,180" fill="var(--bg-1, #fafafa)" stroke="var(--fg, #0a0a0b)" stroke-width="1.5" stroke-linejoin="round"/><line x1="305" y1="85" x2="295" y2="180" stroke="var(--accent, #0a66d8)" stroke-width="3.5" stroke-linecap="round"/><line x1="300" y1="132.5" x2="359.67" y2="138.781" stroke="var(--accent, #0a66d8)" stroke-width="2" stroke-linecap="round" marker-end="url(#mesh-faces-arrow)"/><text x="340" y="122.5" text-anchor="middle" fill="var(--accent, #0a66d8)" font-weight="600" font-style="italic">S<tspan font-size="10" dy="3">f</tspan></text><text x="300" y="236" text-anchor="middle" fill="var(--accent, #0a66d8)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">face f</text><line x1="300" y1="224" x2="300" y2="186" stroke="var(--accent, #0a66d8)" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="120" y1="60" x2="125" y2="168" stroke="var(--fg, #0a0a0b)" stroke-width="3.5" stroke-linecap="round"/><line x1="122.5" y1="114" x2="67.5588" y2="116.544" stroke="var(--fg-2, #52525b)" stroke-width="2" stroke-linecap="round" marker-end="url(#mesh-faces-arrow)"/><text x="40" y="92" text-anchor="middle" fill="var(--fg-2, #52525b)" font-size="12">boundary</text><text x="40" y="140" text-anchor="middle" fill="var(--fg-2, #52525b)" font-size="12">face zone</text><circle cx="212" cy="128" r="3" fill="var(--fg-2, #52525b)"/><circle cx="388" cy="138" r="3" fill="var(--fg-2, #52525b)"/><text x="212" y="152" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">owner[f]</text><text x="392" y="162" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">neighbour[f]</text></svg>
