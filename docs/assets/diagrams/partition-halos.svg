<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 352" role="img" aria-labelledby="partition-halos-title partition-halos-desc" font-family="var(--font-sans, ui-sans-serif, system-ui, sans-serif)" font-size="13"><title id="partition-halos-title">Owned and ghost cells after partitioning</title><desc id="partition-halos-desc">A mesh of six cells is cut in two partitions. Each partition stores its owned cells first, then ghost copies of the neighbouring cells owned by the other partition. A halo exchange copies owned values into ghosts; a reverse exchange adds the partial sums accumulated on ghosts back to the owner.</desc><style>@media (prefers-color-scheme: dark){svg{--accent:#4c9dff;--bg-1:#111113;--danger:#ff5c5c;--fg:#ededef;--fg-2:#a1a1aa;--fg-3:#85858f}}</style><defs><marker id="partition-halos-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><polygon points="70,28 136,34 136,91 70,97" fill="var(--bg-1, #fafafa)" stroke="var(--fg, #0a0a0b)" stroke-width="1.5" stroke-linejoin="round"/><text x="103" y="67.5" text-anchor="middle" fill="var(--fg-2, #52525b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">0</text><polygon points="136,34 202,28 202,97 136,91" fill="var(--bg-1, #fafafa)" stroke="var(--fg, #0a0a0b)" stroke-width="1.5" stroke-linejoin="round"/><text x="169" y="67.5" text-anchor="middle" fill="var(--fg-2, #52525b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">1</text><polygon points="202,28 268,34 268,91 202,97" fill="var(--bg-1, #fafafa)" stroke="var(--fg, #0a0a0b)" stroke-width="1.5" stroke-linejoin="round"/><text x="235" y="67.5" text-anchor="middle" fill="var(--fg-2, #52525b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">2</text><polygon points="268,34 334,28 334,97 268,91" fill="var(--bg-1, #fafafa)" stroke="var(--fg, #0a0a0b)" s