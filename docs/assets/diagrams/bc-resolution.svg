<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-labelledby="bc-resolution-title bc-resolution-desc" font-family="var(--font-sans, ui-sans-serif, system-ui, sans-serif)" font-size="13"><title id="bc-resolution-title">How a boundary zone gets its condition</title><desc id="bc-resolution-desc">Each boundary zone is checked in order. A case rule that matches wins, with provenance code; two matching rules are error E0411. Otherwise the type read from the mesh applies, with provenance mesh; inlet, outlet and thermal wall types need values from the case, error E0413. A zone with faces and neither is error E0412.</desc><style>@media (prefers-color-scheme: dark){svg{--accent:#4c9dff;--bg-0:#0a0a0b;--bg-1:#111113;--danger:#ff5c5c;--fg:#ededef;--fg-2:#a1a1aa;--fg-3:#85858f;--line-strong:#3a3a41}}</style><defs><marker id="bc-resolution-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect x="20" y="96" width="120" height="44" rx="8" fill="var(--bg-1, #fafafa)" stroke="var(--fg, #0a0a0b)" stroke-width="1.5"/><text x="80" y="123" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-weight="600">zone</text><rect x="200" y="40" width="170" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line-strong, #d1d1d6)" stroke-width="1.5"/><text x="285" y="67" text-anchor="middle" fill="var(--fg, #0a0a0b)">case rule</text><rect x="420" y="48" width="76" height="28" rx="14" fill="var(--bg-0, #ffffff)" stroke="var(--accent, #0a66d8)" stroke-width="1.5"/><text x="458" y="67" text-anchor="middle" fill="var(--accent, #0a66d8)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">code</text><line x1="370" y1="62" x2="418" y2="62" stroke="var(--accent, #0a66d8)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#bc-resolution-arrow)"/><text x="530" y="60" text-anchor="start" fill="var(--danger, #c4161c)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">E0411</text><text x="530" y="76" text-anchor="start" fill="var(--fg-3, #707078)" font-size="11">two rules</text><rect x="200" y="118" width="170" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line-strong, #d1d1d6)" stroke-width="1.5"/><text x="285" y="145" text-anchor="middle" fill="var(--fg, #0a0a0b)">mesh type</text><rect x="420" y="126" width="76" height="28" rx="14" fill="var(--bg-0, #ffffff)" stroke="var(--fg, #0a0a0b)" stroke-width="1.5"/><text x="458" y="145" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">mesh</text><line x1="370" y1="140" x2="418" y2="140" stroke="var(--fg, #0a0a0b)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#bc-resolution-arrow)"/><text x="530" y="138" text-anchor="start" fill="var(--danger, #c4161c)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">E0413</text><text x="530" y="154" text-anchor="start" fill="var(--fg-3, #707078)" font-size="11">needs values</text><rect x="200" y="196" width="170" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line-strong, #d1d1d6)" stroke-width="1.5"/><text x="285" y="223" text-anchor="middle" fill="var(--fg, #0a0a0b)">nothing</text><text x="400" y="216" text-anchor="start" fill="var(--danger, #c4161c)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">E0412</text><text x="400" y="232" text-anchor="start" fill="var(--fg-3, #707078)" font-size="11">no condition</text><path d="M140 118 H170 V62 H198" fill="none" stroke="var(--fg-2, #52525b)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bc-resolution-arrow)"/><path d="M285 84 V116" fill="none" stroke="var(--fg-3, #707078)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bc-resolution-arrow)" stroke-dasharray="3 3"/><text x="292" y="104" text-anchor="start" fill="var(--fg-3, #707078)" font-size="11">no match</text><path d="M285 162 V194" fill="none" stroke="var(--fg-3, #707078)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bc-resolution-arrow)" stroke-dasharray="3 3"/><text x="292" y="182" text-anchor="start" fill="var(--fg-3, #707078)" font-size="11">untyped</text></svg>
