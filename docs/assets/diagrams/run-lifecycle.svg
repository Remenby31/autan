<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 296" role="img" aria-labelledby="run-lifecycle-title run-lifecycle-desc" font-family="var(--font-sans, ui-sans-serif, system-ui, sans-serif)" font-size="13"><title id="run-lifecycle-title">Run states</title><desc id="run-lifecycle-desc">autan plan checks the case; an error stops before any run directory exists. A run starts in state running and ends in one of five states: converged, completed and stopped always write solution.cgns, diverged writes it if possible, failed may not.</desc><style>@media (prefers-color-scheme: dark){svg{--accent:#4c9dff;--accent-soft:rgba(76,157,255,0.14);--bg-0:#0a0a0b;--danger:#ff5c5c;--fg:#ededef;--fg-2:#a1a1aa;--fg-3:#85858f;--line-strong:#3a3a41;--success:#3ecf8e}}</style><defs><marker id="run-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect x="20" y="120" width="108" height="44" rx="8" fill="var(--bg-0, #ffffff)" stroke="var(--line-strong, #d1d1d6)" stroke-width="1.5"/><text x="74" y="147" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">autan plan</text><line x1="74" y1="164" x2="74" y2="206" stroke="var(--danger, #c4161c)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#run-lifecycle-arrow)"/><text x="74" y="224" text-anchor="middle" fill="var(--danger, #c4161c)" font-size="11">error: no run</text><line x1="128" y1="142" x2="186" y2="142" stroke="var(--fg-2, #52525b)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#run-lifecycle-arrow)"/><rect x="188" y="120" width="108" height="44" rx="8" fill="var(--accent-soft, rgba(10,102,216,0.1))" stroke="var(--accent, #0a66d8)" stroke-width="1.5"/><text x="242" y="147" text-anchor="middle" fill="var(--accent, #0a66d8)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12" font-weight="600">running</text><path d="M296 142 C 330 142, 330 44, 364 44" fill="none" stroke="var(--fg-3, #707078)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#run-lifecycle-arrow)"/><rect x="366" y="26" width="112" height="36" rx="18" fill="var(--bg-0, #ffffff)" stroke="var(--success, #18794e)" stroke-width="1.5"/><text x="422" y="49" text-anchor="middle" fill="var(--success, #18794e)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">converged</text><text x="500" y="50" text-anchor="middle" fill="var(--fg-2, #52525b)" font-size="15">●</text><path d="M296 142 C 330 142, 330 96, 364 96" fill="none" stroke="var(--fg-3, #707078)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#run-lifecycle-arrow)"/><rect x="366" y="78" width="112" height="36" rx="18" fill="var(--bg-0, #ffffff)" stroke="var(--fg, #0a0a0b)" stroke-width="1.5"/><text x="422" y="101" text-anchor="middle" fill="var(--fg, #0a0a0b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">completed</text><text x="500" y="102" text-anchor="middle" fill="var(--fg-2, #52525b)" font-size="15">●</text><path d="M296 142 C 330 142, 330 148, 364 148" fill="none" stroke="var(--fg-3, #707078)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#run-lifecycle-arrow)"/><rect x="366" y="130" width="112" height="36" rx="18" fill="var(--bg-0, #ffffff)" stroke="var(--fg-2, #52525b)" stroke-width="1.5"/><text x="422" y="153" text-anchor="middle" fill="var(--fg-2, #52525b)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">stopped</text><text x="500" y="154" text-anchor="middle" fill="var(--fg-2, #52525b)" font-size="15">●</text><path d="M296 142 C 330 142, 330 200, 364 200" fill="none" stroke="var(--fg-3, #707078)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#run-lifecycle-arrow)"/><rect x="366" y="182" width="112" height="36" rx="18" fill="var(--bg-0, #ffffff)" stroke="var(--danger, #c4161c)" stroke-width="1.5"/><text x="422" y="205" text-anchor="middle" fill="var(--danger, #c4161c)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">diverged</text><text x="500" y="206" text-anchor="middle" fill="var(--fg-2, #52525b)" font-size="15">◐</text><path d="M296 142 C 330 142, 330 252, 364 252" fill="none" stroke="var(--fg-3, #707078)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#run-lifecycle-arrow)"/><rect x="366" y="234" width="112" height="36" rx="18" fill="var(--bg-0, #ffffff)" stroke="var(--danger, #c4161c)" stroke-width="1.5"/><text x="422" y="257" text-anchor="middle" fill="var(--danger, #c4161c)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="12">failed</text><text x="500" y="258" text-anchor="middle" fill="var(--fg-2, #52525b)" font-size="15">○</text><text x="488" y="16" text-anchor="start" fill="var(--fg-3, #707078)" font-family="var(--font-mono, ui-monospace, Menlo, monospace)" font-size="11">solution.cgns</text><text x="20" y="286" text-anchor="start" fill="var(--fg-3, #707078)" font-size="11">● written   ◐ if possible   ○ optional</text></svg>
