[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autan"
dynamic = ["version"]
description = "GPU-native unstructured finite-volume CFD solver: Python SDK and CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.1",
    "pint>=0.24",
    "pydantic>=2.10",
    "rfc8785>=0.1.4",
    "tomli-w>=1.1",
]

[project.optional-dependencies]
ui = ["autan-ui"]

[project.scripts]
autan = "autan.cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.33.0",
    "jsonschema>=4.26.0",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.version]
path = "version.txt"
pattern = "(?P<version>.+)"

[tool.hatch.build.hooks.custom]
path = "py/build_hook.py"

[tool.hatch.build.targets.sdist]
artifacts = ["py/autan/_build_info.py"]

[tool.hatch.build.targets.wheel]
packages = ["py/autan"]

[tool.uv.sources]
autan-ui = { path = "ui/server", editable = true }

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "version.txt" }, { git = { commit = true } }]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["py"]
plugins = ["pydantic.mypy"]

# h5py ships neither type hints nor stubs; py/autan/cgns.py is the only module that uses it.
[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true

# autan_ui is the optional `ui` extra, absent from the default environment.
[[tool.mypy.overrides]]
module = ["autan_ui"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["py/tests"]
pythonpath = ["py"]
addopts = ["--strict-markers", "-ra"]
