[project]
name = "cfd-bench"
version = "0.0.0"
description = "Benchmark harness for cfd-solver: timed GPU runs, result schema, regression gate"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23", "rfc3339-validator>=0.1.4"]

[project.scripts]
cfdbench = "cfdbench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfdbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs an NVIDIA GPU and the built stream binary (set CFD_BENCH_STREAM)"]
