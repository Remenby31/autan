[project]
name = "autan-bench"
version = "0.0.0"
description = "Benchmark harness for Autan: timed GPU runs, result schema, regression gate"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23", "rfc3339-validator>=0.1.4"]

[project.scripts]
autan-bench = "autan_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autan_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
