[files]
# French text (design documents, translations named *.fr.*), and binary or generated data.
extend-exclude = [
  "docs/PLAN.md",
  "docs/plan.html",
  "docs/research/state-of-the-art*",
  "docs/design/*.html",
  "*.fr.*",
  "*.msh",
  "*.cgns",
  "uv.lock",
  "tests/data/",
]

[default.extend-words]
contrats = "contrats" # lane name "CFD - SDK & contrats"
Comput = "Comput"     # journal abbreviation, "PLoS Comput Biol"
Numer = "Numer"       # journal abbreviation, "Int. J. Numer. Meth. Fluids"
strat = "strat"       # Scotch API, SCOTCH_Strat
ser = "ser"           # pydantic-core API, plain_serializer_function_ser_schema
Aer = "Aer"           # DrivAer, automotive aerodynamics benchmark
metalness = "metalness" # three.js material property
DOUT = "DOUT"         # CMake -D definition of a variable named OUT
