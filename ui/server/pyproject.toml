[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autan-ui"
version = "0.1.0"
description = "Local web UI server for Autan: run registry, live history, surface viewer"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "autan",
    "fastapi>=0.162",
    "numpy>=2.1",
    "uvicorn>=0.54",
    "watchfiles>=1.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.uv.sources]
autan = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/autan_ui"]
artifacts = ["src/autan_ui/static/**"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
